# ─────────────────────────────────────────────────────────────────
# DOMAIN-SPECIFIC VOCABULARY
# Maps natural language phrases to schema columns
# ─────────────────────────────────────────────────────────────────

phrase_mappings:

  "highest innovation credits":
    - column: academic_courses_details.total_credit_score
      aggregation: SUM
      parse: SPLIT_PART(total_credit_score, ':', 1)

  "lab validation":
    - column: innovations_at_various_stages_of_technology_readiness_level.stage_of_technology
      filter: "stage_of_technology = 'Level 4'"

  "market ready":
    - column: innovations_at_various_states_of_technology_readiness_level.stage_of_technology
      filter: "stage_of_technology = 'Level 9'"

  "trending up":
    - column: (computed YoY delta)
      method: LAG() window function

  "cut grants":
    - column: innovation_grant_from_govt.grant_received
      comparison: "grant_received < LAG(grant_received) OVER (PARTITION BY institute)"

  "national average":
    - column: (computed scalar)
      method: AVG() OVER () as national_avg
