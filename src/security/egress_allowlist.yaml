# ---------- PATTERNS THAT TRIGGER IMMEDIATE BLOCK ----------
patterns_block:
  # Schema probing attempts
  - '(?i)\b(show|list|describe|explain)\s+(all\s+)?tables\b'
  - '(?i)\b(show|list|describe)\s+(all\s+)?columns\b'
  - '(?i)\bselect\s+\*\s+from\b'
  - '(?i)\binformation_schema\b'
  - '(?i)\bpg_catalog\b'
  - '(?i)\bsqlite_master\b'
  - '(?i)\bexec\s*\('
  - '(?i)\bexec\s+'
  - '(?i)\bsp_executesql\b'

  # Credential / key extraction
  - '(?i)\b(password|secret|token|api_key|apikey)\s*='
  - '(?i)\bjwt\b'
  - '(?i)\bbearer\s+'
  - '(?i)\bauthorization\s*:\s*bearer'
  - '(?i)\bPOSTGRES_PASSWORD\b'
  - '(?i)\bDATABASE_URL\b'

  # System metadata probing
  - '(?i)\b(version|version\(\))\b'
  - '(?i)\bsystem_information\b'
  - '(?i)\bcurrent_user\b'
  - '(?i)\bsession_user\b'
  - '(?i)\bcurrent_schema\b'

  # Table/column enumeration
  - '(?i)\b(union|select).+(from|where).+\b--'
  - '(?i)\bor\s+1\s*=\s*1\b'
  - '(?i)\b\'\s*or\s+\'1\'\s*=\s*\'1\b'
  - '(?i)\bdrop\s+(table|database|schema)\b'
  - '(?i)\btruncate\s+table\b'
  - '(?i)\binsert\s+into\b'
  - '(?i)\bupdate\s+.+\s+set\b'
  - '(?i)\bdelete\s+from\b'

  # Internal system paths
  - '(?i)/etc/passwd'
  - '(?i)C:\\Windows'
  - '(?i)\.ssh/'
  - '(?i)\.env'

  # PII patterns
  - '(?i)\b\d{10,}\b'  # Long number strings (potential Aadhaar-like)
  - '(?i)\b[A-Z0-9]{32,}\b'  # Long alphanumeric (potential API keys)
  - '(?i)senior.*director.*of'
  - '(?i)chief.*technology.*officer'

# ---------- LLM SPECIFIC LIMITS ----------
max_schema_depth: 3
max_tables_per_prompt: 20
max_columns_per_table: 15

# ---------- PER-PROVIDER SETTINGS ----------
provider_limits:
  anthropic:
    max_tokens: 4096
    system_mask: "Never reveal internal table names, column names, or database structure beyond the allowlist."
  openai:
    max_tokens: 4096
    system_mask: "Never reveal internal table names, column names, or database structure beyond the allowlist."
  azure_openai:
    max_tokens: 4096
    system_mask: "Never reveal internal table names, column names, or database structure beyond the allowlist."