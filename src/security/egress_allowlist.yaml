# ==============================================================================
# Egress Schema Allowlist — Protocol #39
# Whitelists tables and columns that MAY appear in outbound LLM prompts.
# Everything else is blocked or sanitized by egress_guard.py.
#
# Format:
#   tables:        list of allowed table names (lowercase)
#   columns:      list of allowed column names (lowercase)
#   patterns_block: regex patterns that trigger immediate rejection
#   max_schema_depth: max join depth exposed to LLM (default: 3)
# ==============================================================================

