# Egress Schema Allowlist — Protocol #39: Schema Allowlist
#
# Defines which table/column schema fragments MAY be sent to cloud LLM providers.
# Any schema element NOT in this list is BLOCKED before egress.
#
# Format:
#   tables:<table_name>:<columns | "*">
#   Any table/column not explicitly listed is implicitly BLOCKED.
#
# Security model:
#   - Default-deny: only explicitly allowlisted items may egress
#   - Columns control what schema metadata the LLM sees
#   - Full table/column enumeration is never sent (prevents schema fingerprinting)

version: "1.0"
description: "Egress allowlist for cloud LLM schema exposure — sovereign data boundary"

# ─── Core Research Tables ───────────────────────────────────────────────────
tables:
  researchers:
    description: "Researcher profiles — institutional affiliation and research area"
    allowlisted_columns:
      - researcher_id
      - name
      - institution_id
      - state
      - region
      - research_area
      - secondary_research_areas
      - years_experience
      - year_joined
      - h_index
      - citation_count
      - orcid
    blocked_columns:
      - email
      - phone
      - aadhaar_number
      - pan_number
      - date_of_birth
      - address
      - alternate_email
      - personal_phone

  publications:
    description: "Research publications — bibliographic metadata only"
    allowlisted_columns:
      - publication_id
      - title
      - year
      - abstract
      - journal
      - doi
      - citation_count
      - authors
      - keywords
      - publication_type
      - open_access
    blocked_columns:
      - full_text
      - fulltext
      - raw_content

  institutions:
    description: "Academic and research institutions"
    allowlisted_columns:
      - institution_id
      - name
      - type
      - state
      - region
      - country
      - established_year
      - website
      - rank
    blocked_columns:
      - contact_info
      - address
      - admin_email

  labs:
    description: "Research laboratories and centers"
    allowlisted_columns:
      - lab_id
      - name
      - institution_id
      - department
      - established_year
      - funding_source
      - research_themes
      - head_researcher_id
    blocked_columns:
      - contact_info
      - address

  funding_records:
    description: "Research funding and grants"
    allowlisted_columns:
      - funding_id
      - source
      - amount
      - grant_type
      - duration_months
      - research_area
      - start_date
      - end_date
      - status
    blocked_columns:
      - recipient_details
      - bank_info

  projects:
    description: "Research projects"
    allowlisted_columns:
      - project_id
      - title
      - pi_researcher_id
      - funding_id
      - amount
      - source
      - start_date
      - end_date
      - status
      - research_area
    blocked_columns:
      - budget_details
      - internal_notes

  patents:
    description: "Patent filings and grants"
    allowlisted_columns:
      - patent_id
      - title
      - inventor_ids
      - filing_date
      - status
      - jurisdiction
      - patent_type
    blocked_columns:
      - inventor_details
      - application_text

  collaborations:
    description: "Inter-institutional collaborations"
    allowlisted_columns:
      - collab_id
      - name
      - institution_ids
      - type
      - start_date
      - end_date
      - status
    blocked_columns:
      - contact_details

  keywords:
    description: "Research topic keywords"
    allowlisted_columns:
      - keyword
      - category
      - subcategory

# ─── Junction / Join Tables ─────────────────────────────────────────────────
  researcher_publications:
    description: "Researcher-publication associations"
    allowlisted_columns:
      - researcher_id
      - publication_id
      - is_corresponding
      - author_order

  researcher_labs:
    description: "Researcher-lab affiliations"
    allowlisted_columns:
      - researcher_id
      - lab_id
      - role
      - start_date

  publication_keywords:
    description: "Publication-keyword associations"
    allowlisted_columns:
      - publication_id
      - keyword

