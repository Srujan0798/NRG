<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is set by backend SecurityHeadersMiddleware -->
    <!-- Security headers are set by backend middleware -->
    <meta name="description" content="National Research Intelligence Platform - Sovereign Research Graph" />
    <link rel="preload" href="/fonts/SohneDisplay.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" media="(min-width: 641px)" />
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" media="(min-width: 641px)" />
    <title>NRG · National Research Intelligence Platform</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #f4efe3; color: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; }
      .nrg-boot-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .nrg-boot-panel { width: min(960px, 100%); }
      .nrg-boot-kicker { margin: 0 0 18px; color: #c2410c; font-size: 14px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
      .nrg-boot-title { margin: 0; max-width: 820px; font-size: clamp(40px, 7vw, 64px); line-height: 1.04; }
      .nrg-boot-copy { margin: 18px 0 0; color: #475569; font-size: 18px; }
      .nrg-boot-search { margin-top: 28px; display: flex; align-items: stretch; border: 1px solid #d6d3d1; border-radius: 16px; background: #ffffff; overflow: hidden; }
      .nrg-boot-search input { min-width: 0; flex: 1; border: 0; padding: 18px 20px; color: #0f172a; font: 600 17px/1.4 ui-sans-serif, system-ui, sans-serif; outline: none; }
      .nrg-boot-search button { border: 0; background: #0f172a; color: #fff; padding: 0 22px; font: 800 14px/1 ui-sans-serif, system-ui, sans-serif; }
      .nrg-boot-chips { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
      .nrg-boot-chips button { min-height: 44px; border: 1px solid #d6d3d1; border-radius: 999px; background: rgba(255,255,255,.74); color: #334155; padding: 0 15px; font: 700 13px/1 ui-sans-serif, system-ui, sans-serif; }
      .nrg-boot-scale { margin-top: 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .nrg-boot-stat { border-left: 1px solid #d6d3d1; padding-left: 14px; }
      .nrg-boot-stat strong { display: block; color: #0f172a; font: 800 22px/1.1 ui-sans-serif, system-ui, sans-serif; }
      .nrg-boot-stat span { display: block; margin-top: 6px; color: #475569; font: 700 12px/1.3 ui-sans-serif, system-ui, sans-serif; }
      .nrg-boot-answer { margin-top: 22px; }
      .nrg-boot-phase { border: 1px solid #d6d3d1; border-radius: 16px; background: #ffffff; padding: 18px; }
      .nrg-boot-phase h2 { margin: 0; color: #0f172a; font: 800 15px/1.3 ui-sans-serif, system-ui, sans-serif; }
      .nrg-boot-phase p { margin: 8px 0 0; color: #475569; font: 600 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
      @media (max-width: 640px) {
        .nrg-boot-shell { place-items: start stretch; padding: 28px 16px; }
        .nrg-boot-search { flex-direction: column; border-radius: 14px; }
        .nrg-boot-search button { min-height: 48px; }
        .nrg-boot-scale { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="nrg-boot-shell" aria-label="National Research Graph loading">
        <section class="nrg-boot-panel">
          <p class="nrg-boot-kicker">National Research Graph</p>
          <h1 class="nrg-boot-title">Ask anything about Indian research.</h1>
          <p class="nrg-boot-copy">Every answer cited. Every byte signed.</p>
          <form id="nrg-boot-form" class="nrg-boot-search" aria-label="Ask National Research Graph">
            <input id="nrg-boot-input" data-testid="hero-search-input" aria-label="Ask National Research Graph" placeholder="Ask anything about Indian research..." autofocus />
            <button type="submit">Search</button>
          </form>
          <div class="nrg-boot-chips" aria-label="Suggested questions">
            <button data-testid="suggestion-chip" type="button">Top renewable energy grants</button>
            <button data-testid="suggestion-chip" type="button">Hydrogen fuel cell network</button>
            <button data-testid="suggestion-chip" type="button">Computer science funding</button>
            <button data-testid="suggestion-chip" type="button">Solar patents by institute</button>
          </div>
          <div class="nrg-boot-scale" aria-label="Research graph scale">
            <div class="nrg-boot-stat"><strong data-testid="scale-counter" data-target="58">0</strong><span>tables</span></div>
            <div class="nrg-boot-stat"><strong data-testid="scale-counter" data-target="1200000" data-compact="true">0</strong><span>researchers</span></div>
            <div class="nrg-boot-stat"><strong data-testid="scale-counter" data-target="47000" data-compact="true">0</strong><span>institutes</span></div>
            <div class="nrg-boot-stat"><strong data-testid="scale-counter" data-target="600" data-suffix="GB">0</strong><span>research data</span></div>
          </div>
          <div id="nrg-boot-answer" class="nrg-boot-answer" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script>
      let nrgAppPromise
      const nrgAppEntry = '__NRG_APP_ENTRY__'
      const input = document.getElementById('nrg-boot-input')
      const form = document.getElementById('nrg-boot-form')
      const answer = document.getElementById('nrg-boot-answer')
      const loadNrgApp = () => {
        if (!nrgAppPromise) nrgAppPromise = import(nrgAppEntry)
        return nrgAppPromise
      }
      const rememberQuery = () => {
        window.__nrgBootQuery = input?.value || ''
      }
      const animateCounters = () => {
        const nodes = document.querySelectorAll('[data-testid="scale-counter"]')
        const started = performance.now()
        const draw = (now) => {
          const progress = Math.min(1, (now - started) / 4800)
          nodes.forEach((node) => {
            const target = Number(node.dataset.target || 0)
            const value = Math.round(target * progress)
            node.textContent = node.dataset.compact === 'true' && value >= 1000000
              ? `${(value / 1000000).toFixed(1)}M`
              : node.dataset.compact === 'true' && value >= 1000
                ? `${Math.round(value / 1000)}K`
                : `${value.toLocaleString('en-IN')}${node.dataset.suffix || ''}`
          })
          if (progress < 1) requestAnimationFrame(draw)
        }
        requestAnimationFrame(draw)
      }
      const showPlanning = () => {
        if (answer) answer.innerHTML = '<section data-testid="streaming-answer-panel" class="nrg-boot-phase"><div data-testid="phase-planning"><h2>Planning the evidence route</h2><p>Checking access level, citations, and audit proof.</p></div></section>'
      }
      window.__nrgLoadApp = loadNrgApp
      if (window.location.pathname !== '/app') {
        loadNrgApp()
      } else {
        setTimeout(animateCounters, 900)
        input?.addEventListener('input', () => {
          rememberQuery()
          loadNrgApp()
        }, { once: true })
        form?.addEventListener('submit', (event) => {
          event.preventDefault()
          rememberQuery()
          window.__nrgBootSubmit = true
          showPlanning()
          loadNrgApp()
        })
        document.querySelectorAll('[data-testid="suggestion-chip"]').forEach((chip) => {
          chip.addEventListener('click', () => {
            if (input) input.value = chip.textContent || ''
            rememberQuery()
            window.__nrgBootSubmit = true
            showPlanning()
            loadNrgApp()
          })
        })
        const scheduleAppLoad = () => setTimeout(loadNrgApp, 4200)
        if ('requestIdleCallback' in window) {
          requestIdleCallback(scheduleAppLoad, { timeout: 4200 })
        } else {
          scheduleAppLoad()
        }
      }
    </script>
  </body>
</html>
