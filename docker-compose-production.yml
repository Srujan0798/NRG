version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: nrg_postgres
    environment:
      POSTGRES_DB: nrip_prod
      POSTGRES_USER: nrip_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nrip_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/data/schema/production_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - nrg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrip_user -d nrip_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 32G

  neo4j:
    image: neo4j:4.4-enterprise
    container_name: nrg_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nrip_neo4j_pass}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_dbms_memory_heap_initial__size: "8G"
      NEO4J_dbms_memory_heap_max__size: "16G"
      NEO4J_dbms_memory_pagecache_size: "8G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - nrg_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 32G

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nrg_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - nrg_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 16G

  redis:
    image: redis:7-alpine
    container_name: nrg_redis
    command: redis-server --maxmemory 8gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nrg_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 10G

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nrg_api
    environment:
      - DATABASE_URL=postgresql://nrip_user:${POSTGRES_PASSWORD:-nrip_secure_pass}@postgres:5432/nrip_prod
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-nrip_neo4j_pass}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    networks:
      - nrg_network
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 16G

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:

networks:
  nrg_network:
    driver: bridge