version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: nrg-postgres
    environment:
      POSTGRES_USER: nrg_user
      POSTGRES_PASSWORD: nrg_password
      POSTGRES_DB: nrg_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrg_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nrg-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nrg-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_STORAGE__DISK__STORAGE_PATH: /qdrant/storage
      QDRANT_SERVICES_GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nrg-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nrg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nrg-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nrg-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nrg_user:nrg_password@postgres:5432/nrg_research
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - nrg-network
    volumes:
      - ./logs:/app/logs

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nrg-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - nrg-network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  nrg-network:
    driver: bridge