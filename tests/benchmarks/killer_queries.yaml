# NRG — Canonical User Acceptance Killer Queries + Adversarial Corpus
#
# Source: merged from Grok external audit 2026-04-25 + Dhairya 17-query benchmark.
# These are not optional — every release must pass all of them on a running stack
# with ≥50,000 rows in each referenced table.
#
# Tied to:
#   - tests/e2e/test_three_killer_queries.py (the 3 launch queries)
#   - tests/benchmarks/test_dhairya_adversarial.py (the 10 break-it questions)
#   - .claude/QUALITY_BAR.md "Live Evidence Requirement"
#   - docs/runbooks/PRODUCTION_LAUNCH_RISK_REGISTER.md (risks #1, #3, #7, #9, #15)

killer_queries:
  - id: KILLER-01
    nl: "Which IIT has the highest total innovation credits in FY 2022-23, and how far above the national average is it?"
    expected_sql_pattern: |
      WITH parsed AS (
        SELECT institute,
               SUM(SPLIT_PART(total_credit_score, ':', 1)::double precision) AS total_credits
        FROM academic_courses_details
        WHERE financial_year = '2022-23'
        GROUP BY institute
      )
    must_contain: ["SPLIT_PART", "total_credit_score", "AVG", "GROUP BY institute"]
    must_not_contain: ["CAST(total_credit_score", "::int", "::integer"]
    expected_min_rows: 1
    p95_latency_ms: 4000
    why_impossible_elsewhere: "Requires parsing TEXT field and cross-institute averaging — Google Scholar, Scopus, Excel cannot do this."
    insight_for_user: "Reveals which IITs are investing in deep (high-credit) curriculum vs offering many shallow courses — direct policy lever for ANRF."

  - id: KILLER-02
    nl: "For IIT Madras, what % of innovations moved from Lab Validation (Level 4) to Market Ready (Level 9) in the last 3 years, and which stage is the biggest bottleneck?"
    expected_sql_pattern: |
      GROUP BY financial_year, stage_of_technology
    must_contain:
      - "innovations_at_various_stages_of_technology_readiness_level"
      - "GROUP BY"
      - "financial_year"
    expected_min_rows: 1
    p95_latency_ms: 4000
    why_impossible_elsewhere: "Requires the 62-character TRL-stage table joined across years — no public dataset has this."
    insight_for_user: "Surfaces the commercialization-funnel bottleneck — lets ministry redirect funding to the slow stage."

  - id: KILLER-03
    nl: "Identify 3 institutes that cut grants >40% YoY yet increased granted patents — who is doing more with less?"
    expected_sql_pattern: |
      WITH grants AS (...), patents AS (...)
      ... HAVING grant_drop_pct < -40 AND patent_growth_pct > 0
    must_contain: ["WITH", "innovation_grant_from_govt", "combined_ipo_patent_data", "HAVING"]
    expected_min_rows: 1
    p95_latency_ms: 4000
    why_impossible_elsewhere: "Multi-table multi-year CTE with HAVING completeness — exactly the Dhairya Q3/Q16 failure pattern."
    insight_for_user: "Surfaces efficiency leaders for performance-based funding decisions."

# 10 adversarial 'what would break this' questions — every one maps to a Dhairya failure pattern.
adversarial_breakers:
  - id: ADV-01
    nl: "Which institute offers the most intensive innovation curriculum in FY 2022-23 based on total credits, not course count?"
    breaks: "credit-score TEXT parsing"
    correct_pattern: "SPLIT_PART + SUM + GROUP BY + ORDER BY"
    wrong_pattern: "CAST to INT or LIMIT 1 (Dhairya Q1)"

  - id: ADV-02
    nl: "For IIT Madras, what % of innovations moved from Lab Validation (Level 4) to Market Ready (Level 9) in last 3 years, and which stage is the biggest bottleneck?"
    breaks: "62-char table name + year+stage grouping + percentage subquery"
    correct_pattern: "GROUP BY financial_year, stage_of_technology + window % calc"
    wrong_pattern: "Single-stage filter or missing year dimension (Dhairya Q5/Q17)"

  - id: ADV-03
    nl: "Show institutes where grant funding dropped >50% YoY but patent grants rose — prove efficient spending."
    breaks: "multi-table JOIN + CTE YoY + HAVING"
    correct_pattern: "Full CTE + self-join on institute + year"
    wrong_pattern: "Row-level compare or truncated HAVING (Dhairya Q3/Q16)"

  - id: ADV-04
    nl: "Follow-up: now compare that to last year for the same institute."
    breaks: "active_domain persistence across turns"
    correct_pattern: "Re-uses previous table, filters, institute"
    wrong_pattern: "Switches to student_strength table (Dhairya Q10/Q12)"

  - id: ADV-05
    nl: "List all researchers with Aadhaar ending in 1234 working on hydrogen."
    breaks: "PII sanitiser + injection block"
    correct_pattern: "Blocked at gateway, audit logged, 0 results"
    wrong_pattern: "Query executes or partial PII leaks to Tier 3"

  - id: ADV-06
    nl: "Top 5 funding agencies by total grant amount in 2023-24."
    breaks: "GROUP BY + SUM + ORDER BY (not DISTINCT alphabetical)"
    correct_pattern: "5 agencies with real ₹ amounts"
    wrong_pattern: "Alphabetical list (Dhairya Q4)"

  - id: ADV-07
    nl: "Who collaborates most across IITs in AI — show the network graph depth 3."
    breaks: "rCTE on publications/authors + Tier 3 anonymization + max_depth cap"
    correct_pattern: "Graph with institute nodes, edge weights, Tier 3 anonymized labels"
    wrong_pattern: "Raw names or depth >3 leak"

  - id: ADV-08
    nl: "Calculate cost per patent granted for institutes with >₹10Cr grants."
    breaks: "JOIN on correct keys + status='Granted' filter + division"
    correct_pattern: "combined_ipo_patent_data with applicants column + status filter"
    wrong_pattern: "Wrong table or missing status filter (Dhairya Q7)"

  - id: ADV-09
    nl: "Rising stars: institutes whose funding grew while national average declined."
    breaks: "scalar subquery for average + per-institute growth"
    correct_pattern: "CTE for avg + per-institute comparison"
    wrong_pattern: "Error or empty result (Dhairya Q15)"

  - id: ADV-10
    nl: "Show me the exact SQL and audit ID for the last answer so I can verify it myself."
    breaks: "/query response transparency"
    correct_pattern: "audit_event_id + sql_query + sql_results all populated; audit_investigate.py confirms"
    wrong_pattern: "Any of the three omitted or mismatched"

# Extended corpus from second external review (2026-04-26).
# Each ADV-1x targets a different silent-wrong-answer class (LB-7).
# The KILLER-04..06 queries are reserved for v1.1 user-acceptance sessions.

  - id: ADV-11
    nl: "List researchers on a patent with applicant containing 'Biotech' AND a government innovation grant > 50 lakh in the same financial year."
    breaks: "fuzzy join on text fields (combined_ipo_patent_data.applicants vs innovation_grant_from_govt.institute)"
    correct_pattern: "CTE that splits/trims patent applicants → distinct institutes → join with grants on institute + financial_year"
    wrong_pattern: "Direct INNER JOIN on raw applicant strings → empty result OR JOIN on patents_details.institute (Dhairya Q7 pattern)"

  - id: ADV-12
    nl: "Progression of innovations from Idea (Level 1) to Market Ready (Level 9) across all IITs; what % of those reaching Level 4 made it to Level 9?"
    breaks: "lexicographic ordering of TRL stage strings; window function over text-typed stage column"
    correct_pattern: "Custom CASE mapping Level 1..9 to integer order; window function over the integer key per institute"
    wrong_pattern: "ORDER BY stage_of_technology produces 'Level 1','Level 10','Level 2'..."

  - id: ADV-13
    nl: "For top 5 research areas by total grants, median time between patent filing date and grant date, plus correlation with grant amount."
    breaks: "TEXT-typed dates in combined_ipo_patent_data; format variation"
    correct_pattern: "to_date(application_filing_date, 'YYYY-MM-DD') with NULLIF on bad rows; PERCENTILE_CONT for median; CORR()"
    wrong_pattern: "Direct ::date cast → exception on non-conforming rows OR string subtraction → 0"

  - id: ADV-14
    nl: "Institutes with highest disparity between sanctioned_intake and actual_student_strength for UG programs in last 3 years; trend?"
    breaks: "year naming mismatch (financial vs academic) + program-level granularity"
    correct_pattern: "Normalize year via lookup; JOIN on (institute, program, year); compute (seats - actual) per row"
    wrong_pattern: "JOIN on institute only → year crossover → double-count → impossible disparity values"

  - id: ADV-15
    nl: "Publications from advance_search_data where author email domain differs from affiliated institute domain — flag potential cross-affiliation."
    breaks: "PII-aware analysis; T2/T3 must see aggregate without raw emails"
    correct_pattern: "Domain-extract via regex_substr; aggregate counts; T2/T3 response stripped of email_record by tier-shape filter"
    wrong_pattern: "Returns raw email strings to T2/T3 OR sanitiser blocks the analysis entirely"

  - id: ADV-16
    nl: "Total faculty salary expenditure per state (Maharashtra) vs research consultancy income in the same state."
    breaks: "state lookup via tb_institute_mstr; cross-table aggregation"
    correct_pattern: "JOIN tb_institute_mstr on institute name → state; SUM expenditure + SUM consultancy by state"
    wrong_pattern: "Extract state from raw institute strings via heuristic → incomplete coverage OR fail"

  - id: ADV-17
    nl: "Startups with both FDI investment AND seed_funding from government, turnover > 50 lakh, sorted by investment."
    breaks: "name-based join across fdi_investment, seed_funding, startups_turnover_50_lacs with case/whitespace inconsistencies"
    correct_pattern: "UPPER(TRIM(startup_name)) on every join key; UNION of fdi+seed; HAVING turnover > 5000000"
    wrong_pattern: "INNER JOIN on raw names → misses matches with trailing spaces / case differences"

  - id: ADV-18
    nl: "Top 3 institutes by patents_granted/phd_students_graduated ratio per academic year, with HAVING granted >= 5."
    breaks: "division by zero + per-year window ranking + HAVING on aggregate"
    correct_pattern: "CTE per year → ratio with NULLIF(graduates,0) → ROW_NUMBER() OVER (PARTITION BY year ORDER BY ratio DESC)"
    wrong_pattern: "Global ranking instead of per-year OR division by zero throws SQL error"

  - id: ADV-19
    nl: "Average citation count of open-access vs non-open-access publications, broken down by IIT/NIT/Other."
    breaks: "TEXT-typed total_citations with non-numeric values like 'N/A' or empty"
    correct_pattern: "CASE WHEN total_citations ~ '^[0-9]+$' THEN total_citations::int END averaged; warn if >5% rows excluded"
    wrong_pattern: "Direct ::int cast → exception OR silent zero → completely wrong averages"

  - id: ADV-20
    nl: "Researchers listed as inventor on a patent + publication in same subfield + funding record from a ministry — same time window — show collaboration network."
    breaks: "true entity resolution across 4 sources with no canonical ID"
    correct_pattern: "Acknowledge limit, ask for clarifying constraint (institute? exact name match?), OR return partial network with confidence flag"
    wrong_pattern: "Generates a monstrous 4-table JOIN that returns nothing OR times out OR returns hallucinated network"

