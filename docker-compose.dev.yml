# ==============================================================================
# Development docker-compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================

services:
  postgres:
    restart: on-failure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data:rw
      - ./db/seed:/docker-entrypoint-initdb.d:rw

  qdrant:
    restart: on-failure
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    restart: on-failure
    ports:
      - "6379:6379"

  api:
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=DEBUG
      - UVICORN_WORKERS=1

  frontend:
    restart: on-failure
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

  kong:
    restart: on-failure
    ports:
      - "8080:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"

volumes:
  postgres_data_dev:
    driver: local
