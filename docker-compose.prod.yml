# ==============================================================================
# Production docker-compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# ==============================================================================

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 1
    command: postgres -c wal_level=logical -c max_connections=200 -c shared_buffers=256MB

  qdrant:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 2

  redis:
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --bind 0.0.0.0
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    restart: always
    command: >
      sh -c "uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --timeout-keep-alive 5"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: 2
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/all"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    restart: always
    profiles:
      - prod
    deploy:
      resources:
        limits:
          memory: 128M

  kong:
    restart: always
    profiles:
      - prod
