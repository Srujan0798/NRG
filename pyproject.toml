[project]
name = "nrg"
version = "1.0.0"
description = "National Research Graph - Sovereign AI Platform"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.1.8",
    "langchain==1.2.15",
    "langchain-core==1.3.0",
    "langchain-text-splitters==1.1.2",
    "langsmith==0.7.32",
    "qdrant-client==1.11.3",
    "protobuf>=5,<7",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "pydantic==2.13.2",
    "numpy==1.26.3",
    "sentence-transformers==2.3.1",
    "pytest==8.2.2",
    "faker==22.6.0",
    "fastapi==0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "requests==2.32.3",
    "PyJWT==2.8.0",
    "langchain-google-genai==4.2.2",
    "sqlglot>=20.0.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "spacy>=3.8.0,<4.0.0",
    "alembic>=1.14.0",
    "prometheus_client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-rerunfailures",
    "hypothesis==6.100.1",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
    "locust>=2.32,<3",
]
nlp = [
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = [".", "src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
