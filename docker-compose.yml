services:
  postgres:
    image: postgres:16
    container_name: nrg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nrg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nrg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nrg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/seed:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrg"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - postgres

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: nrg-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nrg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nrg-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/nrg_research.db}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./nrg_research.db:/app/nrg_research.db
      - ./infrastructure/kong/ssl:/app/infrastructure/kong/ssl:ro
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: nrg-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  kong:
    image: kong:3.6
    container_name: nrg-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled,rate-limiting-advanced
      KONG_NGINX_WORKER_PROCESSES: "2"
    ports:
      - "8080:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    volumes:
      - ./infrastructure/kong:/kong:ro
    depends_on:
      - api
      - redis
    profiles:
      - dev
      - prod

volumes:
  postgres_data:
  qdrant_data:

networks:
  default:
    name: nrg-network
