version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nrg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nrg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nrg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nrg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/seed:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrg"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nrg-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - prod
      - qdrant

  redis:
    image: redis:7-alpine
    container_name: nrg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - dev
      - prod
      - redis

  api:
    build: .
    container_name: nrg-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/nrg_research.db}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    volumes:
      - ./nrg_research.db:/app/nrg_research.db:ro
      - ./infrastructure/kong/ssl:/app/infrastructure/kong/ssl:ro
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - dev
      - prod

  kong:
    image: kong:3.6
    container_name: nrg-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_LOG_LEVEL: info
    ports:
      - "8080:8000"
      - "8443:8443"
    volumes:
      - ./infrastructure/kong:/kong
    depends_on:
      - api
    profiles:
      - prod

volumes:
  postgres_data:
  qdrant_data:

networks:
  default:
    name: nrg-network