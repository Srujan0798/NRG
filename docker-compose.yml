version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nrg-postgres
    environment:
      POSTGRES_USER: nrg_user
      POSTGRES_PASSWORD: nrg_password
      POSTGRES_DB: nrg_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrg_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nrg-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_STORAGE__DISK__STORAGE_PATH: /qdrant/storage
      QDRANT_SERVICES_GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data: