version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nrg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nrg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nrg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nrg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/seed:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrg"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - prod

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nrg-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333 readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - prod

  redis:
    image: redis:7-alpine
    container_name: nrg-redis
    ports:
      - "6379:6379"
    profiles:
      - dev
      - prod

  api:
    build: .
    container_name: nrg-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nrg:nrg_secret@postgres:5432/nrg
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    profiles:
      - dev
      - prod

  kong:
    image: kong:3.6
    container_name: nrg-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_LOG_LEVEL: info
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./infrastructure/kong:/kong
    depends_on:
      - api
    profiles:
      - prod

volumes:
  postgres_data:
  qdrant_data:

networks:
  default:
    name: nrg-network