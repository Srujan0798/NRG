repos:
- repo: local
  hooks:
  - id: gitleaks
    name: Detect hardcoded secrets
    entry: gitleaks git --pre-commit --staged --redact .
    language: system
    pass_filenames: false
  - id: check-cloud-synthesis-env
    name: Validate CLOUD_SYNTHESIS_ALLOWED boolean in .env
    entry: python scripts/check-env.py
    language: system
    pass_filenames: false
    always_run: true
  - id: forbidden-vocab-check
    name: Production-only vocabulary gate
    entry: bash scripts/forbidden_vocab_check.sh
    language: system
    pass_filenames: false
    always_run: true
  - id: audit-chain-health
    name: Verify immutable audit chain
    entry: python3 scripts/audit_chain_health_check.py
    language: system
    pass_filenames: false
    always_run: true
  - id: schema-parity-static
    name: Verify db_struct/Alembic table parity
    entry: python3 scripts/check_schema_sync.py --migration-static
    language: system
    pass_filenames: false
    always_run: true
  - id: data-quality-scorecard
    name: Verify data quality scorecard
    entry: python3 scripts/data_quality_scorecard.py --json-output .cache/data_quality_scorecard.json --markdown-output .cache/data_quality_scorecard.md --baseline docs/ops/data_quality_scorecard.json --check-baseline --fail-on-p0
    language: system
    pass_filenames: false
    always_run: true
  - id: pipeline-contracts
    name: Validate orchestration pipeline contracts
    entry: python3 scripts/validate_contracts.py --docs-output .cache/pipeline_contracts.md --report-output .cache/pipeline_contracts_report.json --version-baseline docs/ops/pipeline_contract_versions.json
    language: system
    pass_filenames: false
    always_run: true
  - id: jwt-secret-config
    name: Verify JWT secret placeholder length
    entry: python3 scripts/check_jwt_secret_config.py
    language: system
    pass_filenames: false
    always_run: true
  - id: pydantic-migration-guard
    name: Verify Pydantic/Python migration guardrails
    entry: python3 scripts/check_pydantic_migration_guard.py
    language: system
    pass_filenames: false
    always_run: true
  - id: sqlfluff-text-to-sql
    name: Lint Text-to-SQL SQL artifacts
    entry: .venv/bin/sqlfluff lint src/skills/text_to_sql/
    language: system
    pass_filenames: false
  - id: slow-test-marker-check
    name: Require slow marker for long tests
    entry: python scripts/check_slow_test_markers.py
    language: system
    files: ^tests/.*\.py$
  - id: workflow-links
    name: Workflow link integrity
    entry: bash scripts/check_workflow_links.sh
    language: system
    pass_filenames: false
    always_run: true
