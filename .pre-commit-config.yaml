repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-cloud-synthesis-env
        name: Ensure CLOUD_SYNTHESIS_ALLOWED=true in .env
        entry: python scripts/check-env.py
        language: system
        pass_filenames: false
        always_run: true