[pytest]
testpaths = tests
pythonpath = . src
asyncio_mode = auto

markers =
    unit: unit tests for individual components
    integration: tests that exercise external services
    e2e: end-to-end persona flow tests
    chaos: chaos engineering tests for fault tolerance
    load: load and performance tests
    security: security tests that block deployment
    contract: API contract validation tests
    snapshot: snapshot/visual regression tests
    property: property-based tests for invariants
    regression(bug_id, description): regression test for a fixed bug
    slow: slow-running tests that can be skipped locally
    uat: user acceptance tests against live API
    timeout: tests with execution time limits

addopts =
    -v --tb=short --color=yes
    --strict-markers
    --strict-config
    --cov=src --cov-report=term-missing --cov-report=xml
    -m "not slow"

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
