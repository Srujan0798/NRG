[pytest]
testpaths = tests
pythonpath = . src
asyncio_mode = auto

markers =
    unit: unit tests for individual components
    integration: tests that exercise external services
    e2e: end-to-end persona flow tests
    smoke: fast smoke tests — run on every commit
    security: security tests that block deployment
    dpdp: DPDP-2023 compliance tests
    chaos: chaos engineering tests for fault tolerance
    load: load and performance tests
    contract: API contract validation tests
    snapshot: snapshot/visual regression tests
    property: property-based tests for invariants
    regression(bug_id, description): regression test for a fixed bug
    evals: evaluation tests for model quality
    slow: slow-running tests that can be skipped locally
    uat: user acceptance tests against live API
    timeout: tests with execution time limits
    xdist_group(name): keep tests with shared services/state on the same xdist worker

addopts =
    -v --tb=short --color=yes
    --strict-markers
    --strict-config
    --dist=loadgroup
    -m "not slow"

# LB-4: Parallel execution for sub-5-minute local suite
# Usage: pytest tests/ -n auto --no-cov  (auto-detect CPU cores)
# Usage: pytest tests/ -n 4 --no-cov     (fixed workers)
# Usage: pytest                           (single-threaded, default)
# Coverage is explicit in CI and release scripts; keeping it out of default
# addopts prevents local xdist runs from contending on .coverage SQLite state.

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
