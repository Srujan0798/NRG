# ==============================================================================
# Default server configuration for NRG
# Serves frontend static files and proxies API requests
# ==============================================================================

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ${SERVER_NAME:-localhost};

    if ($request_uri ~* "(?:\.\.|%2e%2e|%252e%252e|%5c|%255c)") {
        return 400;
    }

    # ==============================================================================
    # Frontend - React SPA
    # ==============================================================================
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ==============================================================================
    # API Proxy
    # ==============================================================================
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket support for SSE
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ==============================================================================
    # Health Check Endpoint (no auth required, no rate limiting)
    # ==============================================================================
    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        limit_req off;
    }

    location /health/all {
        proxy_pass http://api_backend/health/all;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        limit_req off;
    }

    # ==============================================================================
    # Metrics endpoint for monitoring (restrict in production)
    # ==============================================================================
    location /metrics {
        proxy_pass http://api_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # In production, restrict to internal network via IP whitelist
    }

    # ==============================================================================
    # Kong Admin API (internal only)
    # ==============================================================================
    location /kong/ {
        proxy_pass http://api_backend:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        internal;
    }

    # ==============================================================================
    # Static files for well-known endpoints (Let's Encrypt)
    # ==============================================================================
    location /.well-known/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }
}
