_format_version: "3.0"
_transform: true

services:
  - name: nrg-api
    url: http://host.docker.internal:8001
    routes:
      - name: public-auth-route
        paths:
          - /login
          - /refresh
          - /health
        strip_path: false
        preserve_host: true
      - name: protected-query-route
        paths:
          - /query
        strip_path: false
        preserve_host: true
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              key_claim_name: iss
              header_names:
                - authorization
          - name: acl
            config:
              allow:
                - researcher
                - government
                - industry
                - guest
              hide_groups_header: false
      - name: protected-data-route
        paths:
          - /researchers
          - /logout
          - /
        strip_path: false
        preserve_host: true
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              key_claim_name: iss
              header_names:
                - authorization
          - name: acl
            config:
              allow:
                - researcher
                - government
                - industry
              hide_groups_header: false

