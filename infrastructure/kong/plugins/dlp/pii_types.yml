# IITGN Security Perimeter - PII Detection Patterns
# DLP Plugin Configuration for Kong Gateway

pii_patterns:
  aadhaar:
    regex: '\b\d{4}\s?\d{4}\s?\d{4}\b'
    block: true
    tokenize: true
    severity: critical
    description: "Indian Aadhaar card number (12 digits)"
    
  pan:
    regex: '\b[A-Z]{5}\d{4}[A-Z]\b'
    block: true
    severity: critical
    description: "Indian Permanent Account Number"
    
  phone:
    regex: '\b(\+91|0)?[6-9]\d{9}\b'
    block: true
    tokenize: true
    severity: high
    description: "Indian phone number with country code"
    
  passport:
    regex: '\b[A-Z]{1}[0-9]{7}\b'
    block: true
    severity: critical
    description: "Indian passport number"
    
  email:
    regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    tokenize: true
    severity: medium
    description: "Email address"
    
  upi_id:
    regex: '\b[a-zA-Z0-9._-]+@[a-zA-Z]{2,}\b'
    block: true
    severity: high
    description: "UPI payment ID"
    
  bank_account:
    regex: '\b\d{9,18}\b'
    block: true
    severity: critical
    description: "Bank account number (9-18 digits)"
    
  ifsc:
    regex: '\b[A-Z]{4}0[A-Z0-9]{6}\b'
    block: true
    severity: critical
    description: "Indian Financial System Code"
    
  driving_license:
    regex: '\b[A-Z]{2}[0-9]{2}\s?[0-9]{11}\b'
    block: true
    severity: high
    description: "Indian driving license number"
    
  voter_id:
    regex: '\b[A-Z]{3}[0-9]{7}\b'
    block: true
    severity: high
    description: "Indian voter ID number"

# Tokenization configuration
tokenization:
  method: "hmac_sha256"
  preserve_format: true
  show_last_chars: 4
  secret_env_var: "DLP_TOKENIZATION_SECRET"

# Audit configuration
audit:
  log_blocked: true
  log_tokenized: true
  include_request_id: true
  include_client_ip: true
  log_level: "notice"
