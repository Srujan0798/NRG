# NRG Helm Chart - Production Override Values
# Use this file for NIC/MeitY production deployments
# Values here override values.yaml for production-specific configuration

# Production namespace
namespace: nrg-production

security:
  jwtSecretMinBytes: 32
  jwtSecretPlaceholder: "vault://secret/data/nrg/production#jwt_secret-minimum-32-bytes"

# Production image tag
image:
  tag: "v1.0.0-prod"

# Increase API replicas for production
api:
  replicaCount: 3
  autoscaling:
    minReplicas: 3
    maxReplicas: 20

# Production resource limits
api:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Enable all production features
features:
  knowledgeGraph: false
  consentUi: true

# Production Vault configuration
vault:
  address: "https://vault-internal.nrg-production.svc:8200"
  role: "nrg-app"

# Production backup configuration
backup:
  enabled: true
  s3:
    bucket: "nrg-backups-prod"
    region: "ap-south-1"

# Enable monitoring
prometheus:
  enabled: true
  metricsScrapeInterval: "60s"
  healthScrapeInterval: "15s"

# Enable compliance logging
observability:
  tracing:
    enabled: true
  metrics:
    enabled: true

vectorDrift:
  enabled: true
  lightweightSchedule: "*/5 * * * *"
  deepSchedule: "30 2 * * *"

# Production node selectors
nodeSelector:
  nrg-node: "true"

# Enable chaos engineering in staging (NOT production)
chaos:
  enabled: false

# Network policies enabled
networkPolicies:
  enabled: true
