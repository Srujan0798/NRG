# Default values for NRG Helm chart

replicaCount: 2

image:
  repository: nrg/api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "kong"
  annotations:
    konghq.com/strip-path: "false"
  hosts:
    - host: nrg.india
      paths:
        - path: /
          pathType: Prefix

tls: []

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Database configuration
database:
  type: "postgresql"
  host: "nrg-postgresql"
  port: 5432
  name: "nrg"
  user: "nrg"
  password: "nrg_secret"

# Qdrant configuration
qdrant:
  enabled: true
  host: "nrg-qdrant"
  port: 6333

# Redis configuration
redis:
  enabled: true
  host: "nrg-redis-master"
  port: 6379

# LLM configuration
llm:
  planner_provider: "gemini"
  synth_provider: "local_llama"
  verifier_provider: "anthropic"
  local_url: "http://nrg-llama:8080"

# Feature flags
features:
  knowledge_graph: false
  consent_ui: true

# Vault configuration
vault:
  enabled: true
  address: "https://vault.internal:8200"
  role: "nrg-app"
