apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nrg-internal-ca
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg
    nrg.gov.in/ca-type: internal
spec:
  ca:
    secretName: nrg-internal-ca-key
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nrg-api-tls
  namespace: {{ .Values.namespace | default "nrg-production" }}
spec:
  secretName: nrg-api-tls-cert
  isCA: false
  issuerRef:
    name: nrg-internal-ca
    kind: ClusterIssuer
  commonName: nrg-api
  dnsNames:
    - nrg-api
    - nrg-api.nrg-production.svc.cluster.local
  secretTemplate:
    annotations:
      nrg.gov.in/tls-version: "TLS12"
      nrg.gov.in/cipher-suite: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
---
