apiVersion: v1
kind: ConfigMap
metadata:
  name: nrg-kong-config
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-kong
data:
  kong.yaml: |
    _format_version: "3.0"

    services:
      - name: nrg-api
        url: http://nrg-api:8000
        routes:
          - name: nrg-api-route
            paths:
              - /api
            methods:
              - GET
              - POST
              - PUT
              - DELETE
            strip_path: false
        plugins:
          - name: rate-limiting-advanced
            config:
              minute: 100
              hour: 1000
              policy: local
          - name: bot-detection
          - name: dlp
            config:
              allowed_pii_types:
                - email
                - phone
              block_on_match: true

    plugins:
      - name: rate-limiting-advanced
      - name: bot-detection
      - name: dlp