apiVersion: apps/v1
kind: Deployment
metadata:
  name: nrg-api
  labels:
    app: nrg-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: nrg-api
  template:
    metadata:
      labels:
        app: nrg-api
    spec:
      serviceAccountName: nrg-sa
      containers:
        - name: api
          image: "nrg/api:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 1000m
              memory: 2Gi
          env:
            - name: DATABASE_URL
              value: "postgresql://nrg:nrg_secret@nrg-postgres:5432/nrg"
            - name: QDRANT_HOST
              value: "nrg-qdrant"
            - name: QDRANT_PORT
              value: "6333"
            - name: REDIS_URL
              value: "redis://nrg-redis:6379/0"
