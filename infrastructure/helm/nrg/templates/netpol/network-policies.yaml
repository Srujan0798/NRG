---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nrg-kong-netpol
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-kong
spec:
  podSelector:
    matchLabels:
      app: nrg-kong
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}  # External ingress via ingress controller
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: nrg-api
      ports:
        - protocol: TCP
          port: 8000
    # Allowlisted LLM hosts for DLP scanning
    {{- range .Values.egressAllowlist }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}