apiVersion: apps/v1
kind: Deployment
metadata:
  name: nrg-llama
  labels:
    app: nrg-llama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nrg-llama
  template:
    metadata:
      labels:
        app: nrg-llama
    spec:
      nodeSelector:
        gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: llama
          image: {{ .Values.llama.image | default "ghcr.io/ggerganov/llama.cpp:server" }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: 16Gi
            requests:
              cpu: "4"
              memory: 8Gi
          args:
            - "--models"
            - "/models"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
          volumeMounts:
            - name: models
              mountPath: /models
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: nrg-llama-models