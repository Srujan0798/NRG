apiVersion: v1
kind: Service
metadata:
  name: nrg-api
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-api
    {{ include "nrg.labels" . | nindent 4 }}
  annotations:
    nrg.gov.in/service-type: internal
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: nrg-api
---
apiVersion: v1
kind: Service
metadata:
  name: nrg-postgres
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-postgres
    app.kubernetes.io/component: database
    {{ include "nrg.labels" . | nindent 4 }}
  annotations:
    nrg.gov.in/service-type: internal
    nrg.gov.in/data-persistence: critical
spec:
  type: ClusterIP
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: nrg-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: nrg-qdrant
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-qdrant
    app.kubernetes.io/component: vector-database
    {{ include "nrg.labels" . | nindent 4 }}
  annotations:
    nrg.gov.in/service-type: internal
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
  selector:
    app: nrg-qdrant
---
apiVersion: v1
kind: Service
metadata:
  name: nrg-redis
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-redis
    app.kubernetes.io/component: cache
    {{ include "nrg.labels" . | nindent 4 }}
  annotations:
    nrg.gov.in/service-type: internal
spec:
  type: ClusterIP
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: nrg-redis
---
apiVersion: v1
kind: Service
metadata:
  name: nrg-kong
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-kong
    app.kubernetes.io/component: api-gateway
    {{ include "nrg.labels" . | nindent 4 }}
  annotations:
    nrg.gov.in/service-type: internal
spec:
  type: {{ .Values.kong.service.type | default "ClusterIP" }}
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: proxy-tls
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: admin
      port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: nrg-kong
---
apiVersion: v1
kind: Service
metadata:
  name: nrg-langfuse
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-langfuse
    app.kubernetes.io/component: observability
    {{ include "nrg.labels" . | nindent 4 }}
  annotations:
    nrg.gov.in/service-type: internal
spec:
  type: {{ .Values.langfuse.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: nrg-langfuse