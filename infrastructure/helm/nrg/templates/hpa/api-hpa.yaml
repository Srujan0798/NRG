apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nrg-api-hpa
  namespace: {{ .Values.namespace | default "nrg-production" }}
  labels:
    app: nrg-api
    {{ include "nrg.labels" . | nindent 4 }}
  annotations:
    nrg.gov.in/scaling-policy: proactive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nrg-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas | default 3 }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas | default 20 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage | default 60 }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max