apiVersion: v2
name: nrg
description: |
  National Research Graph - Sovereign AI Platform
  NIC/MeitY Infrastructure Deployment
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - national-research-graph
  - sovereign-ai
  - india
  - nic
  - meity
home: https://nrg.gov.in
sources:
  - https://github.com/nrg-india/nrg
maintainers:
  - name: NRG Platform Team
    email: platform@nrg.gov.in

dependencies:
  - name: postgresql
    version: 15.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 19.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

icon: https://nrg.gov.in/favicon.ico

annotations:
  category: AI/ML Platform
  licenses: Proprietary