apiVersion: v2
name: nrg
description: National Research Graph - Sovereign AI Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: 15.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 19.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kong
    version: 2.x.x
    repository: https://charts.konghq.com
    condition: kong.enabled
