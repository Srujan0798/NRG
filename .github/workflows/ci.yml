name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          uv pip install pytest pytest-cov
          pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term
      - name: Check coverage threshold
        run: |
          python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); rate = float(root.get('line-rate')); print(f'Coverage: {rate*100:.1f}%'); exit(0 if rate >= 0.60 else 1)"

  test-node:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

  docker-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose --profile dev build
      - name: Start services
        run: docker compose --profile dev up -d
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && echo "API is healthy" && exit 0
            sleep 2
          done
          echo "API failed to start"
          docker compose logs api
          exit 1
      - name: Wait for Qdrant health
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:6333/readyz && echo "Qdrant is healthy" && exit 0
            sleep 2
          done
          echo "Qdrant failed to start"
          docker compose logs qdrant
          exit 1
      - name: Smoke test endpoints
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/health/db
          curl -sf http://localhost:8000/health/qdrant
          echo "All health checks passed"
      - name: Tear down
        if: always()
        run: docker compose --profile dev down --volumes --remove-orphans

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install linters
        run: uv pip install ruff mypy black
      - name: Run lint
        run: ruff check src tests
      - name: Run typecheck
        run: mypy src

  secrets-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_v8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_v8.18.2_linux_x64.tar.gz
      - name: Run gitleaks
        run: ./gitleaks detect --no-banner --verbose

  e2e-playwright:
    runs-on: ubuntu-22.04
    needs: [test-python, test-node]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv and backend deps
        run: |
          pip install uv
          uv pip install -e ".[dev]"
      - name: Seed database
        run: python scripts/seed_database.py
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Qdrant
        run: docker compose up -d qdrant && sleep 5
      - name: Start backend
        run: |
          python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && echo "Backend ready" && exit 0
            sleep 1
          done
          cat /tmp/uvicorn.log
          exit 1
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/uvicorn.pid) || true
      - name: Stop Qdrant
        if: always()
        run: docker compose down qdrant
