name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

env:
  PYTEST_ADDOPTS: "-v --tb=short --color=yes"
  TEST_RUNTIME_BASELINE_SECONDS: "250"
  TEST_RUNTIME_MAX_SECONDS: "300"

jobs:
  # ===========================================================================
  # CORE TEST SUITES - each suite provides DEPLOYMENT CONFIDENCE
  # ===========================================================================

  property-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run property-based tests (tier filtering, citations, token budget)
        run: |
          uv pip install pytest pytest-timeout
          pytest tests/property/ -v --tb=short -m property
        continue-on-error: false

  chaos-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run chaos tests (LLM failover, DB failure, Redis down, Qdrant unavailable)
        run: |
          uv pip install pytest pytest-timeout
          pytest tests/chaos/ -v --tb=short -m chaos --timeout=60
        continue-on-error: false

  load-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run load tests (50 concurrent, P95<15s, sustained load)
        run: |
          uv pip install pytest pytest-benchmark
          pytest tests/load/ -v --tb=short -m load
        continue-on-error: false

  security-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run security tests (SQL injection, rate limiting, HMAC validation)
        run: |
          uv pip install pytest
          python scripts/check_jwt_secret_config.py
          pytest tests/security/test_sql_injection_blocked.py tests/security/test_rate_limit_enforced.py tests/security/test_hmac_validation.py tests/scripts/test_red_team_live_replay.py -v --tb=short -m security
        continue-on-error: false

  contract-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Validate orchestration pipeline contracts
        id: pipeline-contracts
        run: |
          mkdir -p .cache
          python scripts/validate_contracts.py \
            --docs-output docs/ops/pipeline_contracts.md \
            --report-output .cache/pipeline_contracts_report.json \
            --version-baseline docs/ops/pipeline_contract_versions.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Run contract tests (API schema validation)
        run: |
          uv pip install pytest
          pytest tests/contract/ -v --tb=short -m contract
      - name: Run integration tests for major contract bumps
        if: steps.pipeline-contracts.outputs.integration_required == 'true'
        run: |
          pytest tests/integration/ -v --tb=short -m integration --no-cov
        continue-on-error: false

  e2e-persona-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Install Playwright and browser
        run: |
          uv pip install playwright
          playwright install chromium --with-deps
      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build && cd ..
      - name: Start API server
        run: |
         uv pip install -e .
          nohup python -m src.api.main &
          for i in {1..30}; do curl -sf http://localhost:8000/health && echo "API ready" && break; sleep 2; done
      - name: Run E2E browser persona tests serially
        run: |
          pytest tests/e2e/test_personas.py -v --tb=short -m e2e --no-cov
        continue-on-error: false

  regression-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run regression tests
        run: |
          uv pip install pytest
          pytest tests/regression/ -v --tb=short -m regression
        continue-on-error: false

  # ===========================================================================
  # FULL TEST RUN WITH COVERAGE
  # ===========================================================================

  local-release-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run sub-15-minute local gate
        run: PYTHON_BIN=python bash scripts/run_test_suite.sh
      - name: Upload local gate evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-suite-full
          path: |
            evidence/2026-04-26/test_suite_full.xml
            evidence/2026-04-26/test_suite_full.log

  slow-nightly:
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run slow suite
        run: PYTHON_BIN=python bash scripts/run_test_suite.sh --slow
      - name: Upload slow suite evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-suite-slow
          path: |
            evidence/2026-04-26/test_suite_full_slow.xml
            evidence/2026-04-26/test_suite_full_slow.log

  red-team-live-replay:
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run LB-5 live replay
        run: |
          PYTHON=python bash scripts/red_team_live_replay.py \
            --start-api \
            --api-base http://127.0.0.1:8010 \
            --payloads tests/security/red_team_payloads.yaml \
            --evidence evidence/2026-04-26/17_red_team_results.md \
            --workers 1 \
            --timeout 10 \
            --startup-timeout 90 \
            --chunk-size 10
      - name: Upload red-team evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-team-live-replay
          path: evidence/2026-04-26/17_red_team_results.md

  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ["3.11"]
        tier: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run ${{ matrix.tier }} tests in parallel
        run: |
          uv pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-asyncio
          SECONDS=0
          pytest tests/ \
            -m "${{ matrix.tier }} and not slow and not e2e" \
            -n auto --dist=loadgroup --no-cov \
            --junitxml="test-results-${{ matrix.os }}-${{ matrix.tier }}.xml"
          python scripts/check_test_runtime_budget.py \
            --runtime-seconds "$SECONDS" \
            --baseline-seconds "$TEST_RUNTIME_BASELINE_SECONDS" \
            --max-growth 0.20 \
            --absolute-max-seconds "$TEST_RUNTIME_MAX_SECONDS"
      - name: Upload test timing evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.tier }}
          path: test-results-${{ matrix.os }}-${{ matrix.tier }}.xml

  coverage-python:
    runs-on: ubuntu-22.04
    needs: [test-python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run coverage with xdist-safe reporting
        env:
          COVERAGE_FILE: .coverage.ci
        run: |
          uv pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-asyncio
          pytest tests/ \
            -m "not slow and not e2e" \
            -n auto --dist=loadgroup \
            --cov=src --cov-report=xml --no-cov-on-fail
      - name: Check coverage threshold (80% minimum)
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.get('line-rate'))
          pct = rate * 100
          print(f'Coverage: {pct:.1f}%')
          if rate < 0.80:
              print(f'FAILED: Coverage {pct:.1f}% is below 80% threshold')
              exit(1)
          print('PASSED: Coverage meets threshold')
          "

  # ===========================================================================
  # LINTING & TYPE CHECKING
  # ===========================================================================

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install linters
        run: uv pip install ruff mypy black
      - name: Verify Pydantic/Python migration guardrails
        run: python scripts/check_pydantic_migration_guard.py
      - name: Run ruff linter
        run: ruff check src tests
      - name: Run mypy type check
        run: mypy src

  python-314-compat:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14 compatibility lane
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Run import and contract smoke tests
        run: |
          python -W default -c "import pydantic; import langchain_core; import src.api.main"
          pytest tests/contract/test_pipeline_contracts.py -q --no-cov

  # ===========================================================================
  # PRODUCTION VOCABULARY GATE
  # ===========================================================================

  forbidden-vocab:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run forbidden-vocab check on changed production files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          FORBIDDEN_PATTERN='\b(demo|demo-ready|demo day|demo video|demo dataset|demo rehearsal|pitch deck|MVP|prototype|works on my machine)\b'
          ALLOWLIST='\.claude/rules/production_only\.md|\.claude/memory/|\.agents/skills/forbidden-vocab-cleanup/SKILL\.md|docs/specs/MASTER_EXECUTION_PLAN|scripts/forbidden_vocab_check\.sh|protocols/|BACKLOG\.md$|\.github/workflows/ci\.yml$'

          if [[ -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=2 origin "$BASE_SHA" || true
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD || git diff-tree --no-commit-id --name-only -r HEAD)
          else
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi

          TARGET_FILES=$(printf '%s\n' "$CHANGED_FILES" \
            | grep -E '^(\.agents/|\.claude/|docs/|evidence/|protocols/|scripts/|BACKLOG\.md$|[^/]+\.md$)' \
            | grep -v -E "$ALLOWLIST" \
            | grep -v -E '(^|/)(node_modules|\.npm-cache|playwright-report|test-results|dist|build|coverage)/|\.((json|lock|svg|png|jpg|jpeg|webp|gif|woff2?|ttf|otf|ico|pdf|mp4|webm|min\.js|min\.css))$' \
            || true)

          if [[ -z "$TARGET_FILES" ]]; then
            echo "Forbidden-vocab check passed: no production-controlled changed files"
            exit 0
          fi

          VIOLATIONS=""
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            hit=$(grep -IniE "$FORBIDDEN_PATTERN" "$file" || true)
            if [[ -n "$hit" ]]; then
              VIOLATIONS="${VIOLATIONS}${hit}"$'\n'
            fi
          done <<< "$TARGET_FILES"

          if [[ -n "$VIOLATIONS" ]]; then
            echo "FORBIDDEN VOCABULARY DETECTED:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "Forbidden-vocab check passed"

  # ===========================================================================
  # SECRET SCANNING
  # ===========================================================================

  secrets-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_v8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_v8.18.2_linux_x64.tar.gz
      - name: Run gitleaks
        run: ./gitleaks detect --no-banner --verbose

  # ===========================================================================
  # DOCKER SMOKE TEST
  # ===========================================================================

  docker-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose --profile dev build
      - name: Start services
        run: docker compose --profile dev up -d
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && echo "API is healthy" && exit 0
            sleep 2
          done
          echo "API failed to start"
          docker compose logs api
          exit 1
      - name: Smoke test endpoints
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/health/db
          curl -sf http://localhost:8000/health/qdrant
          echo "All health checks passed"
      - name: Tear down
        if: always()
        run: docker compose --profile dev down --volumes --remove-orphans

  # ===========================================================================
  # FRONTEND TESTS
  # ===========================================================================

  test-node:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test --if-present || true

  # ===========================================================================
  # GATES - All must pass for deployment
  # ===========================================================================

  security-gate:
    runs-on: ubuntu-22.04
    needs: [security-tests, property-tests, contract-tests, regression-tests]
    steps:
      - name: All security tests passed
        run: echo "Security gate passed"

  deploy-block:
    runs-on: ubuntu-22.04
    needs: [test-python, coverage-python, e2e-persona-tests, test-node, lint, secrets-scan, docker-smoke, security-gate, red-team-live-replay]
    if: always()
    steps:
      - name: Check for failures
        run: |
          FAILED=false
          declare -A RESULTS=(
            [test-python]="${{ needs.test-python.result }}"
            [coverage-python]="${{ needs.coverage-python.result }}"
            [e2e-persona-tests]="${{ needs.e2e-persona-tests.result }}"
            [test-node]="${{ needs.test-node.result }}"
            [lint]="${{ needs.lint.result }}"
            [secrets-scan]="${{ needs.secrets-scan.result }}"
            [docker-smoke]="${{ needs.docker-smoke.result }}"
            [security-gate]="${{ needs.security-gate.result }}"
          )
          for job in "${!RESULTS[@]}"; do
            if [[ "${RESULTS[$job]}" == "failure" ]]; then
              echo "FAILED: $job"
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "Blocking deployment - some required checks failed"
            exit 1
          fi
          echo "All gates passed - deployment can proceed"
