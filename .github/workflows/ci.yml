name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip sync pyproject.toml
      - name: Run tests with coverage
        run: |
          uv pip install pytest pytest-cov
          pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term
      - name: Check coverage threshold
        run: |
          python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); rate = float(root.get('line-rate')); print(f'Coverage: {rate*100:.1f}%'); exit(0 if rate >= 0.60 else 1)" || echo "Coverage below 60%"

  test-node:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose smoke test
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose down

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install linters
        run: uv pip install ruff mypy
      - name: Run lint
        run: make lint
      - name: Run typecheck
        run: make typecheck

  secrets-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_v8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_v8.18.2_linux_x64.tar.gz
      - name: Run gitleaks
        run: ./gitleaks detect --no-banner --verbose
