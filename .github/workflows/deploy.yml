name: National Research Graph CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_updated.txt
        pip install pytest pytest-cov

    - name: Run tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Semgrep SAST scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: p/security-audit

    - name: Dependency vulnerability scan
      uses: actions/dependency-review-action@v3

  build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_updated.txt

    - name: Build API Docker image
      run: |
        docker build -f Dockerfile.api -t nrg-api:latest .

    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Save build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: nrg-build
        path: |
          Dockerfile.api
          frontend/dist/

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    environment: staging
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: nrg-build

    - name: Deploy to staging
      run: echo "Deploying to staging environment"
      # Actual deployment steps would go here
      # For example: kubectl apply, terraform apply, etc.

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    
    environment: production
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: nrg-build

    - name: Wait for manual approval
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ secrets.APPROVAL_SECRET }}
        approvers: ${{ vars.PRODUCTION_APPROVERS }}
        wait-time: '360'

    - name: Deploy to production
      run: echo "Deploying to production environment"
      # Actual production deployment steps

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Send deployment notification
      run: |
        echo "Deployment pipeline completed"
        # Add Slack/Teams notification here