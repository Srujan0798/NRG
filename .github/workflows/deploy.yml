name: Deploy NRG

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_TAG_API: nrg-api:${{ github.sha }}
  IMAGE_TAG_FRONTEND: nrg-frontend:${{ github.sha }}
  DATABASE_URL: "sqlite:///data/nrg_research.db"
  NRG_TEST_DATABASE_URL: "sqlite:///data/nrg_research.db"
  NRG_LOCAL_RESEARCH_DB: "data/nrg_research.db"
  JWT_ALGORITHM: "HS256"
  JWT_SECRET: "ci-jwt-secret-for-deploy-workflow-2026-minimum-32-bytes"

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ===========================================================================
  # Pre-deployment Checks
  # ===========================================================================
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if should deploy
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual deployment requested"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "Deploy on main or develop branch"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # Test (runs in parallel with build)
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Seed CI SQLite data
        run: python scripts/seed_production_subset.py --profile ci --no-audit
      - name: Run pytest
        env:
          COVERAGE_FILE: .coverage.deploy
          NRG_TEST_ISOLATE_AUDIT: "1"
          NRG_TEST_AUDIT_BASE: ".pytest_audit_deploy"
        run: |
          uv pip install --system pytest pytest-cov pytest-xdist pytest-asyncio
          mkdir -p "$NRG_TEST_AUDIT_BASE"
          pytest tests/ \
            -v --tb=short \
            -n 2 --dist=loadgroup \
            --ignore=tests/e2e \
            --cov=src --cov-report=xml --no-cov-on-fail \
            -m 'not e2e and not slow and not load and not performance'

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/security-audit

  # ===========================================================================
  # Build Docker Images
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    needs: [pre-check, test, security-scan]
    if: needs.pre-check.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/nrg-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/nrg-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Create deployment manifest
        run: |
          cat > deployment-manifest.json << EOF
          {
            "api_image": "${{ env.REGISTRY }}/${{ github.repository }}/nrg-api:${{ github.sha }}",
            "frontend_image": "${{ env.REGISTRY }}/${{ github.repository }}/nrg-frontend:${{ github.sha }}",
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}"
          }
          EOF
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: deployment-manifest.json

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.nrg.gov.in
    steps:
      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifest
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          echo "API Image: $(cat deployment-manifest.json | jq -r '.api_image')"
          echo "Frontend Image: $(cat deployment-manifest.json | jq -r '.frontend_image')"

          # In production, this would trigger:
          # - kubectl rollout restart deployment/nrg-api -n staging
          # - kubectl rollout restart deployment/nrg-frontend -n staging
          # - kubectl rollout status deployment/nrg-api -n staging
          # For now, echo the deployment command
          echo "DEPLOYMENT_COMMANDS_WOULD_GO_HERE"
      - name: Run smoke tests
        run: |
          echo "Running staging smoke tests..."
          # curl -f https://staging.nrg.gov.in/health
          # curl -f https://staging.nrg.gov.in/health/all
      - name: Notify success
        if: success()
        run: echo "Staging deployment successful"

  # ===========================================================================
  # Deploy to Production (manual approval required)
  # ===========================================================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://nrg.gov.in
    steps:
      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifest
      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.APPROVAL_SECRET }}
          approvers: ${{ vars.PRODUCTION_APPROVERS }}
          wait-time: 3600

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          echo "API Image: $(cat deployment-manifest.json | jq -r '.api_image')"
          echo "Frontend Image: $(cat deployment-manifest.json | jq -r '.frontend_image')"

          # Production deployment commands would go here:
          # kubectl apply -f k8s/production/ --namespace=production
          # kubectl rollout status deployment/nrg-api -n production
          echo "PRODUCTION_DEPLOYMENT_COMMANDS_WOULD_GO_HERE"

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # curl -f https://nrg.gov.in/health
          # curl -f https://nrg.gov.in/health/all
          echo "VERIFICATION_COMMANDS_WOULD_GO_HERE"

  # ===========================================================================
  # Post-deployment Notification
  # ===========================================================================
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send deployment notification
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "Production deployment completed successfully"
          elif [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "Staging deployment completed"
          else
            echo "Deployment failed"
            exit 1
          fi
