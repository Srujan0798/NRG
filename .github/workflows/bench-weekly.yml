name: Benchmark

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2AM
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install uv httpx pyyaml
      - name: Run benchmark
        run: python scripts/bench.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: docs/benchmarks/REPORT.md