# ==============================================================================
# CI/CD Pipeline for NRG
# Deploys to staging on PR merge to main, production with manual approval
# ==============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nrg
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  DATABASE_URL: "sqlite:///data/nrg_research.db"
  NRG_TEST_DATABASE_URL: "sqlite:///data/nrg_research.db"
  NRG_LOCAL_RESEARCH_DB: "data/nrg_research.db"
  JWT_ALGORITHM: "HS256"
  JWT_SECRET: "ci-jwt-secret-for-deploy-workflow-2026-minimum-32-bytes"

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # Quality Bar Scorecard — blocks all deployments
  # ===========================================================================
  quality-bar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt 2>/dev/null || true
          pip install -q pytest locust 2>/dev/null || true
          pip install -q -e .

      - name: Start seeded API for C4 scorecard
        run: |
          python scripts/seed_production_subset.py --profile ci --no-audit
          NRG_QUOTA_DISABLED=1 nohup python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 4 > /tmp/nrg-c4-api.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "API ready for C4 scorecard"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nrg-c4-api.log
          exit 1

      - name: Run Quality Bar Scorecard
        id: scorecard
        run: |
          NRG_C4_REQUIRE_LIVE=1 python scripts/quality_bar_scorecard.py --json-only
          RESULT=$?
          echo "scorecard_exit=$RESULT" >> $GITHUB_OUTPUT
          echo "scorecard_json=scripts/quality_bar_scorecard.json" >> $GITHUB_OUTPUT
          if [ $RESULT -ne 0 ]; then
            echo "::error::Quality Bar scorecard FAILED — 6/6 required for release"
            exit 1
          fi

      - name: Upload scorecard JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-bar-scorecard
          path: scripts/quality_bar_scorecard.json

      - name: Fail if not 6/6
        if: steps.scorecard.outputs.scorecard_exit != '0'
        run: exit 1

  # ===========================================================================
  # Build and Test
  # ===========================================================================
  build:
    needs: quality-bar
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_repository: ${{ steps.image.outputs.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Qdrant
        run: docker compose -f docker-compose.yml up -d qdrant redis

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image repository
        id: image
        run: echo "repository=$(echo '${{ github.repository_owner }}/nrg' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}/api:${{ github.sha }}
          target: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run API smoke tests
        run: |
          docker run -d --name api-test -p 8000:8000 -e APP_ENV=test ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}/api:${{ github.sha }}
          sleep 10
          curl -sf http://localhost:8000/health && echo "API healthy"
          docker rm -f api-test

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS staging configuration
        id: aws_config
        env:
          AWS_ROLE_ARN_STAGING: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          if [ -z "$AWS_ROLE_ARN_STAGING" ] || [ -z "$AWS_REGION" ] || [ -z "$ECR_REGISTRY" ]; then
            echo "::warning::AWS staging secrets are not configured; skipping ECR/ECS deploy"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.aws_config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: steps.aws_config.outputs.configured == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push images to ECR
        if: steps.aws_config.outputs.configured == 'true'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ needs.build.outputs.image_repository }}/api:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/nrg-api:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ needs.build.outputs.image_repository }}/frontend:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/nrg-frontend:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/nrg-api:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/nrg-frontend:${{ github.sha }}

      - name: Deploy to ECS staging
        if: steps.aws_config.outputs.configured == 'true'
        run: |
          aws ecs update-service --cluster nrg-staging --service nrg-api --force-new-deployment
          aws ecs update-service --cluster nrg-staging --service nrg-frontend --force-new-deployment
          aws ecs wait services-stable --cluster nrg-staging --services nrg-api,nrg-frontend

      - name: Run smoke tests
        if: steps.aws_config.outputs.configured == 'true'
        run: |
          for i in {1..10}; do
            curl -sf https://staging.nrg.gov.in/health && echo "Staging healthy" && break
            sleep 10
          done

      - name: Skip staging deploy when AWS secrets are absent
        if: steps.aws_config.outputs.configured != 'true'
        run: echo "::warning::AWS staging secrets are not configured; staging deploy skipped after build and API smoke checks"

  # ===========================================================================
  # Deploy to Production (manual approval required)
  # ===========================================================================
  deploy-production:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push images to ECR (production tags)
        run: |
          docker tag ${{ env.REGISTRY }}/${{ needs.build.outputs.image_repository }}/api:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/nrg-api:latest
          docker tag ${{ env.REGISTRY }}/${{ needs.build.outputs.image_repository }}/frontend:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/nrg-frontend:latest
          docker push ${{ secrets.ECR_REGISTRY }}/nrg-api:latest
          docker push ${{ secrets.ECR_REGISTRY }}/nrg-frontend:latest

      - name: Deploy to ECS production
        run: |
          aws ecs update-service --cluster nrg-prod --service nrg-api --force-new-deployment
          aws ecs update-service --cluster nrg-prod --service nrg-frontend --force-new-deployment
          aws ecs wait services-stable --cluster nrg-prod --services nrg-api,nrg-frontend

      - name: Notify deployment
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} -d '{"text":"NRG deployed to production: ${{ github.sha }}"}'
