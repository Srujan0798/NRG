# ==============================================================================
# CI/CD Pipeline for NRG
# Deploys to staging on PR merge to main, production with manual approval
# ==============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nrg
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # Quality Bar Scorecard — blocks all deployments
  # ===========================================================================
  quality-bar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt 2>/dev/null || true
          pip install -q pytest locust 2>/dev/null || true

      - name: Run Quality Bar Scorecard
        id: scorecard
        run: |
          pip install -q -e . 2>/dev/null || true
          python scripts/quality_bar_scorecard.py --json-only
          RESULT=$?
          echo "scorecard_exit=$RESULT" >> $GITHUB_OUTPUT
          echo "scorecard_json=scripts/quality_bar_scorecard.json" >> $GITHUB_OUTPUT
          if [ $RESULT -ne 0 ]; then
            echo "::error::Quality Bar scorecard FAILED — 6/6 required for release"
            exit 1
          fi

      - name: Upload scorecard JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-bar-scorecard
          path: scripts/quality_bar_scorecard.json

      - name: Fail if not 6/6
        if: steps.scorecard.outputs.scorecard_exit != '0'
        run: exit 1

  # ===========================================================================
  # Build and Test
  # ===========================================================================
  build:
    needs: quality-bar
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Qdrant
        run: docker compose -f docker-compose.yml up -d qdrant redis

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
          target: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run API smoke tests
        run: |
          docker run -d --name api-test -p 8000:8000 -e APP_ENV=test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
          sleep 10
          curl -sf http://localhost:8000/health && echo "API healthy"
          docker rm -f api-test

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push images to ECR
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/nrg-api:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/nrg-frontend:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/nrg-api:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/nrg-frontend:${{ github.sha }}

      - name: Deploy to ECS staging
        run: |
          aws ecs update-service --cluster nrg-staging --service nrg-api --force-new-deployment
          aws ecs update-service --cluster nrg-staging --service nrg-frontend --force-new-deployment
          aws ecs wait services-stable --cluster nrg-staging --services nrg-api,nrg-frontend

      - name: Run smoke tests
        run: |
          for i in {1..10}; do
            curl -sf https://staging.nrg.gov.in/health && echo "Staging healthy" && break
            sleep 10
          done

  # ===========================================================================
  # Deploy to Production (manual approval required)
  # ===========================================================================
  deploy-production:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push images to ECR (production tags)
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/nrg-api:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/nrg-frontend:latest
          docker push ${{ secrets.ECR_REGISTRY }}/nrg-api:latest
          docker push ${{ secrets.ECR_REGISTRY }}/nrg-frontend:latest

      - name: Deploy to ECS production
        run: |
          aws ecs update-service --cluster nrg-prod --service nrg-api --force-new-deployment
          aws ecs update-service --cluster nrg-prod --service nrg-frontend --force-new-deployment
          aws ecs wait services-stable --cluster nrg-prod --services nrg-api,nrg-frontend

      - name: Notify deployment
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} -d '{"text":"NRG deployed to production: ${{ github.sha }}"}'
